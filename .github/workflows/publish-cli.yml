name: Publish CLI

# `@synap-core/cli` is the ONE artifact an outsider installs, and until now it
# was the only publishable package in the org with NO CI door — `synap-cli/`
# had no `.github/` directory at all. Every sibling has one
# (synap-backend `publish-types.yml`, synap-app `publish-packages.yml`,
# `publish-official-templates.yml`), and each of those headers records the same
# scar: hand-publishing from a laptop is the proven root cause of broken
# artifacts. The CLI proved it too. Verified against the live registry on
# 2026-09-05:
#
#   npm view @synap-core/cli@1.11.0 dependencies
#     → '@synap-core/workspace-templates': 'workspace:*'
#
# An unbundled workspace-protocol range in a published tarball is
# EUNSUPPORTEDPROTOCOL for every consumer. npm said 1.11.0 while the repo said
# 1.12.0, and nothing had ever checked the artifact. `scripts/verify-artifact.mjs`
# is that check; this workflow is the door that runs it.
#
# ── THE SIBLING CHECKOUT IS NOT A CONVENIENCE ────────────────────────────────
# Publishing this package has ALWAYS required `../synap-backend`, for two
# independent reasons:
#   1. `prepack` vendors the unpublished `@synap-core/hub-rest-client` out of
#      `../synap-backend/packages/hub-rest-client` into the tarball
#      (`bundledDependencies`). That package is 404 on npm.
#   2. `scripts/sync-skills.sh` copies `../synap-backend/skills` into the
#      tarball, and hard-fails if the directory is absent.
# So this workflow checks out BOTH repos side by side and runs from `cli/`,
# reproducing the local dev topology those two scripts already assume. It does
# not invent a new one.
#
# ⚠️ OPEN DECISION, deliberately NOT guessed here — see the report.
# The clean end state is to PUBLISH `@synap-core/hub-rest-client` (it is
# zero-dependency, non-private, already `publishConfig.access: public`, v1.0.9)
# and depend on it by semver. That deletes `prepack`/`postpack`,
# `bundledDependencies`, and half of this workflow. It is a live write to the
# npm registry from a repo this change does not own, so it is surfaced rather
# than performed. Everything below works TODAY without it.

on:
  # TWO CHANNELS (founder, 2026-11-02, session 1aff9699: "publish the CLI on
  # every merge to a 'next' channel and install it globally on the Mac").
  #
  #   latest — `workflow_dispatch` on main: a release to everyone is a
  #            decision, not a side effect of merging. It waits for the
  #            `production` reviewer, DERIVES the next patch
  #            (`scripts/release-version.mjs latest`), publishes under
  #            `latest`, then pushes the tag `v<version>`.
  #            It never commits: main is protected (ruleset "main: PR only, no
  #            deletion or force push", bypass OrganizationAdmin only, founder
  #            2 Nov 2026, session b46b66d3), and GITHUB_TOKEN cannot be a
  #            ruleset bypass actor, so a bump pushed to main would be refused.
  #   next   — every push to main that changes what ships. The version is
  #            DERIVED in the job (`scripts/release-version.mjs next`:
  #            `<next patch>-next.<YYYYMMDD>.<sha7>`), published under the
  #            dist-tag `next` ONLY, and never committed: no bump lands on main
  #            and `latest` never moves. A machine opts in with
  #            `npm install -g @synap-core/cli@next`.
  #
  # An earlier `push:` trigger (removed in September) published a PATCH under
  # `latest` on every merge, numbered by whoever merged. A `next` prerelease
  # does neither: `npm install @synap-core/cli` still resolves `latest`, and
  # the version is derived from the commit.
  push:
    branches: [main]
    # What the published tarball is built from. Skills come from the backend
    # sibling at publish time, so a skill change alone ships with the next CLI
    # merge (or a dispatch), not on its own.
    paths:
      - "src/**"
      - "templates/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/publish-cli.yml"
  workflow_dispatch:

# Least privilege: jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # D16: a `latest` release from main waits for the `production`
    # environment's required reviewer; a run dispatched on another branch uses
    # none. A `next` publish runs in `npm-next`: no reviewer (a merge is not a
    # release decision), deployment branches limited to `main`, so only a merge
    # can publish under `next`. npm trusts each environment through its own
    # Trusted Publisher entry (repo Synap-core/synap-cli, workflow
    # publish-cli.yml, environment `production`, and a second one with
    # environment `npm-next`); without the second, a `next` publish fails at
    # "Publish to npm" (ENEEDAUTH, as on 2026-10-16) and nothing is published.
    environment: ${{ github.event_name == 'push' && 'npm-next' || (github.ref == 'refs/heads/main' && 'production' || '') }}
    # One publish per channel at a time. Two `latest` runs would each
    # `npm version patch` from the same base, race on the push, and the loser
    # would try to publish a version the winner already put on the registry
    # (EPUBLISHCONFLICT). `cancel-in-progress: false` on purpose: a run that has
    # already published must be allowed to finish its post-publish
    # verification. Two `next` runs never collide (each sha is its own
    # version); a newer queued merge replaces an older queued one.
    concurrency:
      group: publish-cli-${{ github.event_name == 'workflow_dispatch' && 'latest' || 'next' }}
      cancel-in-progress: false
    env:
      # The npm dist-tag this run publishes under. A push can only ever say `next`.
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'latest' || 'next' }}
    # Least privilege.
    #
    # `contents: write` is REQUIRED, not decorative: the "Tag the release"
    # step (a dispatch only; a `next` run pushes nothing) pushes a tag with
    # GITHUB_TOKEN, and an org (or repo) whose default workflow permission is
    # read-only makes that push fail.
    #
    # `id-token: write` is required for npm Trusted Publishing (OIDC). It is
    # inert until npm is told to trust this workflow, so it is safe to declare
    # ahead of the npm UI configuration.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout synap-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cli
          # Both channels check out the triggering commit itself, never the
          # branch tip: the version is derived from it and a `latest` release
          # tags it, so the tree built must be its tree. Nothing is pushed to a
          # branch, so a detached HEAD is fine.
          ref: ${{ github.sha }}

      # `actions/checkout` cannot write outside $GITHUB_WORKSPACE, so the
      # sibling lands NEXT TO `cli/` rather than at a literal `../`. Running
      # every step from `cli/` makes `../synap-backend` resolve exactly as it
      # does on a developer's machine.
      # Read of the sibling repo only: the Synap Reader App's token (scoped to
      # `backend`, contents: read). CROSS_REPO_TOKEN is the fallback until the App
      # is live (SECURITY-RELEASE-RUNBOOK.md §5.1).
      - name: Mint backend read token (GitHub App)
        id: app-token
        if: ${{ vars.SYNAP_READER_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          private-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          owner: Synap-core
          repositories: backend
          permission-contents: read

      - name: Checkout synap-backend (sibling — hub-rest-client + skills)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo is `Synap-core/backend`. The old `Synap-core/synap-backend`
          # 404s, which is why the only run before 2026-10-16 failed here.
          repository: Synap-core/backend
          # `backend` is public, so this run's own token can read it when
          # neither the Reader App nor CROSS_REPO_TOKEN is configured. An empty
          # token is what failed the 2026-10-11 run ("Input required and not
          # supplied: token").
          token: ${{ steps.app-token.outputs.token || secrets.CROSS_REPO_TOKEN || github.token }}
          path: synap-backend

      # npm Trusted Publishing needs Node >= 22.14.0 and npm >= 11.5.1 in the
      # publishing job (SECURITY-RELEASE-RUNBOOK.md §2.1). Both pins are EXACT.
      # The package's own floor is unchanged (`engines.node >=20`): this is only
      # the toolchain that builds and publishes it, and the typecheck, the tests
      # and the build all run on this same Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing (exact pin, >= 11.5.1)
        run: npm install -g npm@11.20.0 && npm --version

      # pnpm is needed ONLY to build the sibling's hub-rest-client through the
      # backend's own workspace door. The CLI itself is pure npm (its
      # `prepublishOnly` used to shell out to `pnpm` for no reason; it now runs
      # `npm run`, so no publish step depends on pnpm being present).
      #
      # An explicit `version:` is correct HERE and would be wrong in
      # publish-types.yml: that repo pins `packageManager: pnpm@10.28.0` and
      # action-setup refuses to be told twice ("Multiple versions of pnpm
      # specified"), which silently broke that pipeline for two days. We are
      # setting up pnpm for the CHECKED-OUT SIBLING, whose package.json is read
      # from its own directory — so the pin is taken from there.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: synap-backend/package.json

      - name: Build @synap-core/hub-rest-client (unpublished — vendored by prepack)
        working-directory: synap-backend
        run: |
          pnpm install --frozen-lockfile --filter @synap-core/hub-rest-client...
          pnpm --filter @synap-core/hub-rest-client build

      # `npm install`, not `npm ci`: the committed lockfile is older than the
      # manifest (it still records the pre-fix `@synap-core/workspace-templates`
      # range), and `npm ci` hard-fails on that mismatch. The lockfile it
      # refreshes here is committed by the "Commit the version bump" step
      # below, after which this could be tightened to `npm ci`.
      - name: Install CLI dependencies
        working-directory: cli
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: cli
        run: npx tsc --noEmit

      # `skills/` is gitignored and filled from the sibling at publish time;
      # `test/skills-baseline-parity.test.ts` checks that copy, so fill it first.
      - name: Sync skills from the sibling
        working-directory: cli
        run: npm run sync-skills

      - name: Test
        working-directory: cli
        run: npx vitest run

      - name: Build
        working-directory: cli
        run: npm run build

      # npm's `latest` is read from the registry, not from package.json: on
      # 2026-10-27 1.13.0 was published by hand while main still said 1.12.2.
      - name: Read npm's current latest
        id: npm-latest
        working-directory: cli
        run: echo "version=$(npm view @synap-core/cli dist-tags.latest --prefer-online)" >> "$GITHUB_OUTPUT"

      # `next`: the version is derived from the commit and written into this
      # job's package.json only. Nothing is committed, so main never carries a
      # prerelease number and two merges never race on a bump.
      - name: Set the next version (derived, never committed)
        if: github.event_name == 'push'
        working-directory: cli
        env:
          LATEST: ${{ steps.npm-latest.outputs.version }}
        run: |
          VERSION=$(node scripts/release-version.mjs next --latest "$LATEST" --sha "$GITHUB_SHA")
          npm version "$VERSION" --no-git-tag-version
          echo "Publishing $VERSION under the next dist-tag (latest stays $LATEST)"

      # `latest`: derived the same way (the higher of package.json and npm's
      # latest, plus one patch) and never committed. main is protected, and
      # the registry is what says which number was released last.
      - name: Set the latest version (derived, never committed)
        if: github.event_name == 'workflow_dispatch'
        working-directory: cli
        env:
          LATEST: ${{ steps.npm-latest.outputs.version }}
        run: |
          VERSION=$(node scripts/release-version.mjs latest --latest "$LATEST")
          npm version "$VERSION" --no-git-tag-version
          echo "Publishing $VERSION under the latest dist-tag (was $LATEST)"

      # npm moves `latest` to whatever is published under it, even a LOWER
      # version: from a main behind the registry, the bump would publish
      # 1.12.3 over 1.13.0. Stop before anything is tagged or published.
      - name: The bumped version is ahead of npm's latest
        if: github.event_name == 'workflow_dispatch'
        working-directory: cli
        env:
          LATEST: ${{ steps.npm-latest.outputs.version }}
        run: node scripts/release-version.mjs ahead --latest "$LATEST"

      # PRE-publish gate: pack this tree with `npm pack` (the same packer
      # `npm publish` uses — `pnpm pack` would rewrite the very protocols we are
      # hunting and report a clean bill of health for a broken artifact) and
      # fail on any dependency range a consumer cannot resolve. This is the step
      # that would have stopped 1.11.0.
      - name: Verify the artifact BEFORE publishing
        working-directory: cli
        run: node scripts/verify-artifact.mjs --local

      # `--provenance` signs a SLSA attestation with this job's OIDC token
      # (`id-token: write`; this repo is public, which npm requires).
      # Authentication is npm Trusted Publishing (OIDC): 1.12.2 (run
      # 39163073354) published with an empty NODE_AUTH_TOKEN, and on
      # 2026-11-02 no NPM_TOKEN is set on this repo or its `production`
      # environment. The line below only keeps a token usable if one is ever
      # added. `--tag` is explicit: a merge publishes under `next` and can never
      # move `latest` (npm also refuses a prerelease without it).
      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --provenance --tag "$CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The record of a `latest` release is the tag `v<version>`, pushed AFTER
      # `npm publish`. Nothing is committed: main accepts only pull requests.
      # The order is safe either way now that the number is derived from npm's
      # latest: if this push fails, the next dispatch still derives the next
      # patch from the registry, so nothing wedges. (The old flow committed a
      # bump to main and wedged on EPUBLISHCONFLICT whenever npm got ahead of
      # main: the package sat at 1.11.0 while the repo claimed 1.12.0.)
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        working-directory: cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION" HEAD
          git push origin "refs/tags/v$VERSION"

      # POST-publish ground truth: re-download what the registry now actually
      # serves. A local pack proves what your packer produced; only this proves
      # what consumers get.
      - name: Verify the PUBLISHED artifact
        working-directory: cli
        # 1.12.2 (run 39163073354) was on npm within minutes but 5 x 10 s was
        # not enough, and npm caches the "no such version" answer: retry for
        # up to ~4 min and always ask the registry, never the local cache.
        env:
          npm_config_prefer_online: "true"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 16); do
            node scripts/verify-artifact.mjs --registry "@synap-core/cli@$VERSION" && exit 0
            echo "registry not propagated yet (attempt $i/16) — retrying in 15s"
            sleep 15
          done
          exit 1

      # The end-to-end check neither pack-inspection can make: does
      # `npm i -g @synap-core/cli` actually work, and does the installed binary
      # run? Both published-artifact defects this pipeline exists for
      # (an unresolvable range; a bundled dependency that was declared but not
      # shipped) surface here as a failed install or a failed `--version`.
      - name: Smoke-test a clean global install
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm install --no-audit --no-fund "@synap-core/cli@$VERSION"
          ./node_modules/.bin/synap --version
          ./node_modules/.bin/synap market scaffold smoke-probe --kind capability
          ./node_modules/.bin/synap market validate smoke-probe.capability.json

      # A `next` publish must leave `latest` where it found it.
      - name: npm's latest did not move
        if: github.event_name == 'push'
        env:
          LATEST: ${{ steps.npm-latest.outputs.version }}
        run: |
          NOW=$(npm view @synap-core/cli dist-tags.latest --prefer-online)
          echo "latest before: $LATEST, after: $NOW"
          test "$NOW" = "$LATEST"
